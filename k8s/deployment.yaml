apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdn-service
  labels:
    app: cdn-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cdn-service
  template:
    metadata:
      labels:
        app: cdn-service
    spec:
      containers:
        - name: cdn-service
          image: cdn-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9090
          env:
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: cdn-config
                  key: redis_url
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: cdn-config
                  key: minio_endpoint
            # The general token. The service fails fast at boot without it, so
            # the deployment cannot start unless this is wired.
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: cdn-secrets
                  key: app_token
          volumeMounts:
            # Bucket-scoped tokens. The default TOKENS_FILE is config/tokens.json
            # relative to the working directory, which the image sets to /app.
            - name: bucket-tokens
              mountPath: /app/config
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: bucket-tokens
          secret:
            secretName: cdn-secrets
            # optional so a cluster whose Secret predates this key still starts:
            # the service treats a missing token file as "general token only".
            optional: true
            # Only this one key is projected, so the rest of cdn-secrets is not
            # exposed as files in the container.
            items:
              - key: tokens_json
                path: tokens.json
