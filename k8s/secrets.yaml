apiVersion: v1
kind: Secret
metadata:
  name: cdn-secrets
  namespace: default
type: Opaque
data:
  # The general token. Must be at least 32 characters and not a placeholder, or
  # the service refuses to boot. Generate with: openssl rand -hex 32
  app_token: BASE64_ENCODED_TOKEN
  minio_access_key: BASE64_ENCODED_ACCESS_KEY
  minio_secret_key: BASE64_ENCODED_SECRET_KEY
  aws_access_key_id: BASE64_ENCODED_AWS_KEY
  aws_secret_access_key: BASE64_ENCODED_AWS_SECRET

  # Bucket-scoped tokens, mounted by deployment.yaml at /app/config/tokens.json.
  # Holds credentials, so it belongs here rather than in the ConfigMap.
  #
  # Optional: leave the key out entirely and the service runs with the general
  # token alone. The value below is the base64 of an empty set, `{"buckets":[]}`,
  # which is equivalent and is a valid starting point.
  #
  # To fill it in:
  #   cp config/tokens.template.json tokens.json   # then edit it
  #   base64 -w0 tokens.json                       # macOS: base64 -i tokens.json
  #
  # The file is read once at boot, so after changing it:
  #   kubectl rollout restart deployment/cdn-service
  tokens_json: eyJidWNrZXRzIjpbXX0=
