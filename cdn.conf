# Example host nginx configuration.
#
# This is NOT the nginx that ships in the Compose stack. There are two:
#
#   nginx.conf  runs inside the stack as cdn-nginx and load-balances the three
#               api replicas. It is mounted by docker-compose.yml and you do not
#               normally edit it.
#
#   cdn.conf    this file. Copy it to /etc/nginx/conf.d/ on the host, where it
#               terminates TLS and proxies to the Compose stack on
#               localhost:${APP_PORT}. Nothing reads it from the repository.
#
# Replace example.com throughout, point the certificate paths at your own, and
# check the notes marked "decide" below before using it as-is.
#
# ---------------------------------------------------------------------------
# Adding a second site later
#
# The log_format, proxy_cache_path and map declarations below may each be
# declared only once per http context. Copying this whole file for a second
# domain makes nginx refuse to start with a duplicate error. When you get there,
# move those three blocks into their own file that sorts first, e.g.
# /etc/nginx/conf.d/00-cdn-shared.conf, and leave only the server blocks here.
# ---------------------------------------------------------------------------

# Access log format.
#
# The stock `combined` format records no hostname, so with more than one vhost
# writing to one file you cannot answer "is anything actually requesting X on
# host Y". $host fixes that. The two trailing fields earn their place
# operationally: cache= turns hit rate into something measurable from the log,
# and rt= shows what the origin cost, which is how a slow or cold read becomes
# visible.
log_format cdn '$remote_addr - $remote_user [$time_local] "$host" "$request" '
               '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
               'cache=$upstream_cache_status rt=$request_time';

# Response cache.
#
# Object names are UUIDs and therefore immutable, so caching them hard is safe.
# The cost is that a deleted object keeps being served until its entry expires,
# and open source nginx has no purge module. A deletion that must take effect
# immediately needs the cache file removed by hand:
#
#   KEY="httpsGETcdn.example.com/<bucket>/<object>"
#   H=$(printf '%s' "$KEY" | md5sum | cut -d' ' -f1)
#   rm -f /var/cache/nginx/cdn/${H: -1}/${H: -3:2}/$H
#
# Or clear everything: rm -rf /var/cache/nginx/cdn/* && systemctl reload nginx
#
# Decide: max_size against your disk, inactive against how far back your traffic
# reaches.
proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn_cache:100m
                 max_size=10g inactive=7d use_temp_path=off;

# The service answers a resize request with the *original* image, marked
# no-store, when every decode slot is busy. Two separate things have to respect
# that, or a momentary overload becomes days of full-size images served under a
# ?width= URL:
#
#   1. proxy_ignore_headers must NOT list Cache-Control, or nginx caches it.
#   2. `expires` must not overwrite the header on the way to the browser, which
#      is what this map is for: a normal TTL, and nothing when the upstream said
#      no-store.
map $upstream_http_cache_control $cdn_expires {
    ~*no-store  off;
    default     30d;
}

server {
    listen 80;
    server_name cdn.example.com www.cdn.example.com;

    return 301 https://cdn.example.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cdn.example.com;

    ssl_certificate     /etc/letsencrypt/live/cdn.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.example.com/privkey.pem;

    return 301 https://cdn.example.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name cdn.example.com;

    ssl_certificate     /etc/letsencrypt/live/cdn.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.example.com/privkey.pem;

    access_log /var/log/nginx/cdn-access.log cdn;
    error_log  /var/log/nginx/cdn-error.log;

    # Must be at least the service's own BodyLimit, which is 100MB.
    client_max_body_size 100M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Cached read path.
    #
    # The extension list covers everything the service accepts, not only images.
    # Leaving documents and video out costs little while every object is on local
    # disk, and costs real money once objects move to cold storage: each uncached
    # request for an archived object is an S3 GET plus a per-GB retrieval charge.
    # See docs/archive.md.
    location ~* \.(jpg|jpeg|png|gif|ico|webp|bmp|svg|avif|tiff|heic|heif|pdf|doc|docx|xls|xlsx|ppt|pptx|csv|zip|mp4|mov|3gp|avi|mp3|wav)$ {
        proxy_pass http://localhost:9090;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Without these nginx speaks HTTP/1.0 upstream and opens a new connection
        # per request; the empty Connection header is what allows keepalive.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 300;
        proxy_read_timeout    300;

        proxy_cache cdn_cache;
        # The query string carries the resize parameters, so it belongs in the key.
        # Without it every ?width= variant would collide on one entry.
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 301 302 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;

        # Cache-Control is deliberately absent here. See the map above.
        proxy_ignore_headers Set-Cookie Expires;
        proxy_hide_header Set-Cookie;

        add_header X-Cache-Status $upstream_cache_status always;
        expires $cdn_expires;
    }

    # Everything else: uploads, deletes, /health, /metrics, /ws. Never cached.
    location / {
        proxy_pass http://localhost:9090;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 300;
        proxy_read_timeout    300;
    }
}

# ---------------------------------------------------------------------------
# MinIO console, optional.
#
# Decide whether you want this at all. It is the admin interface to every stored
# object, so publishing it means the whole dataset sits behind
# MINIO_ROOT_PASSWORD and whatever console users exist. If only you administer
# the deployment, skip this vhost entirely and reach the console over SSH:
#
#   ssh -L 9001:127.0.0.1:9001 user@your-server
#   then open http://localhost:9001
#
# Publish it only when several people genuinely work in the panel: creating
# buckets, users and policies, or uploading by hand.
#
# Either way, keep the container ports on loopback. docker-compose.yml binds
# 9000, 9001 and 6379 to 127.0.0.1 for this reason: nginx runs on the host, so
# this vhost keeps working while http://<server-ip>:9001 and the S3 API on
# :9000 stay closed. A host firewall does not cover published Docker ports,
# because Docker writes its own iptables rules and bypasses ufw. Verify from
# outside the host:
#
#   nc -zv <server-ip> 9000 9001 6379    # all three should fail
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name minio.example.com www.minio.example.com;

    return 301 https://minio.example.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name minio.example.com;

    ssl_certificate     /etc/letsencrypt/live/minio.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minio.example.com/privkey.pem;

    access_log /var/log/nginx/minio-access.log cdn;
    error_log  /var/log/nginx/minio-error.log;

    # Console uploads pass through here, so this has to be at least as large as
    # the biggest file anyone will drag into the panel. It is unrelated to the
    # CDN's own 100M upload limit.
    client_max_body_size 5G;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location / {
        # Restrict the console to known addresses if that set is small and their
        # addresses are stable. Put your own address in first, or you will lock
        # yourself out.
        #
        # allow 203.0.113.10;   # office
        # deny all;

        proxy_pass http://localhost:9001;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The console is a live UI: WebSockets for its event stream, and uploads
        # that should stream through rather than being buffered to disk first.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_request_buffering off;
        proxy_buffering off;

        proxy_connect_timeout 300;
        proxy_read_timeout    300;
        proxy_send_timeout    300;
    }

    # No location matching object extensions here, deliberately. Putting the
    # CDN's cached read path inside this server means the console hostname starts
    # serving objects and the CDN vhost caches nothing.
}
