openapi: 3.0.0
info:
  title: CDN API Documentation
  version: 1.11.0
  description: |
    CDN Service is a high-performance, cloud-native content delivery solution built with Go. This service combines modern architectural patterns with enterprise-grade features to offer:

    ## Features
    - Image upload and management
    - Automatic image resizing
    - MinIO and AWS S3 integration
    - Real-time monitoring with WebSocket
    - Batch operations
    - Rate limiting protection

    ## Authentication
    Most API endpoints require a Bearer token:
    ```
        Authorization: Bearer <your_token>
    ```

    Two kinds of token exist.

    **General token** (the `TOKEN` env var) is accepted on every authenticated
    endpoint, exactly as before.

    **Bucket-scoped token** has the form `<bucket>:<token>` and authorizes writes to
    that one bucket only:
    ```
        Authorization: Bearer tedarik:6f2c...
    ```
    - Accepted on the object write endpoints (`/upload`, `/batch/upload`,
      `/upload-url`, `/batch/delete`, `DELETE /{bucket}/{path}`, `/resize`).
    - The `bucket` form or body field becomes optional; the token's bucket is used.
      Naming a different bucket returns **403**.
    - Rejected on the operator endpoints (`/aws/*`, `/minio/*`, `/monitor`,
      `/metrics`, `/ws`), which require the general token.

    Bucket-scoped tokens are configured server-side in `config/tokens.json` (see
    `config/tokens.template.json`) and read once at boot.

    ## Contact
    - **Developer**: Mesut GENEZ
    - **GitHub**: [https://github.com/mstgnz/cdn](https://github.com/mstgnz/cdn)

servers:
  - url: ${APP_URL}
    description: Production server
  - url: http://localhost:9090
    description: Local development server

tags:
  - name: File
    description: >-
      Object write operations. Accept the general token or a bucket-scoped token; a
      bucket-scoped token may only act on its own bucket and receives 403 for any
      other, which is why the bucket field is optional for those callers.
  - name: Image
    description: >-
      Image retrieval and transformation. Retrieval is public. POST /resize requires
      a token (general or bucket-scoped) because it feeds request bytes straight
      into ImageMagick.
  - name: Minio
    description: >-
      MinIO bucket administration. General token only: these act on arbitrary
      buckets, so a bucket-scoped token is rejected.
  - name: AWS
    description: >-
      AWS S3 and Glacier operations. General token only.
  - name: System
    description: >-
      Health, metrics and monitoring. /health is public; /metrics and /monitor
      require the general token.
  - name: WebSocket
    description: >-
      Live stats stream. Requires the general token as a `token` query parameter,
      since browsers cannot set an Authorization header.

components:
  securitySchemes:
    TokenQuery:
      type: apiKey
      in: query
      name: token
      description: |
        The general token, passed as a query parameter. Used only by /ws:
        browsers cannot set an Authorization header on a WebSocket handshake.
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Opaque bearer token, not a JWT. Two accepted forms:
        - General token: the `TOKEN` value. Valid on every authenticated endpoint.
        - Bucket-scoped token: `<bucket>:<token>`. Valid only on the object write
          endpoints and only for its own bucket (403 otherwise). Rejected on
          `/aws/*`, `/minio/*`, `/monitor`, `/metrics` and `/ws`.
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          description: Operation success status
        message:
          type: string
          description: Error message
        data:
          type: object
          description: Additional error details if available
    HealthCheck:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded]
          description: Overall system health status
        services:
          type: object
          properties:
            minio:
              type: string
              description: MinIO service status
            aws:
              type: string
              description: AWS service status
            cache:
              type: string
              description: Cache service status
        timestamp:
          type: string
          format: date-time
          description: Check timestamp
    UploadResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Operation success status
        message:
          type: string
          description: Operation result message
        data:
          type: object
          properties:
            minioUpload:
              type: string
              description: MinIO upload status and size information
            minioResult:
              type: object
              description: Detailed MinIO upload result
            awsUpload:
              type: string
              description: AWS upload status
            awsResult:
              type: string
              description: Detailed AWS upload result
            imageName:
              type: string
              description: Generated file name
            objectName:
              type: string
              description: Full path of the file
            link:
              type: string
              description: Public access URL
    ApiResponse:
      type: object
      properties:
        status:
          type: boolean
          description: Operation status
        message:
          type: string
          description: Operation message
        data:
          type: object
          description: Operation data

security:
  - BearerAuth: []

paths:
  /upload:
    post:
      summary: File upload
      description: |
        Single file upload endpoint.
        - Maximum file size: 100MB (`MAX_FILE_SIZE`)
        - Images: jpg, jpeg, png, gif, webp, bmp, tiff, svg, heic, heif, avif
        - Documents: pdf, doc, docx, xls, xlsx, ppt, pptx
        - Text and data: csv, sql
        - Archives: zip
        - Audio and video: mp3, wav, mp4, mov, 3gp, avi
        - Two validation gates, neither client-controlled: the extension
          allowlist above, and the file's own leading bytes. The multipart
          `Content-Type` is not one of them; it is a string the caller writes and
          was dropped as a gate in 1.11.0. See docs/api.md.
        - Optimization is opt-in per request via `optimize=true`, not automatic.
      tags:
        - File
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload
                bucket:
                  type: string
                  description: >-
                    Target bucket name. Required with the general token. Optional
                    with a bucket-scoped token, which always writes to its own
                    bucket; naming a different bucket returns 403.
                path:
                  type: string
                  description: Target directory path (optional)
                aws_upload:
                  type: boolean
                  deprecated: true
                  description: >-
                    Accepted and ignored. Archiving to cold storage is a property
                    of the deployment (on when AWS credentials are configured),
                    not of the request. Kept so existing clients do not fail
                    validation; it will be removed in a later major version.
                  default: false
                optimize:
                  type: boolean
                  description: >-
                    When true, store a visually-lossless, size-reduced version
                    (re-encode + metadata strip + longest side capped at
                    OPTIMIZE_MAX_DIMENSION, default 2560px). Explicit
                    width/height take precedence over the cap. Animated GIFs and
                    non-images pass through untouched. Default false stores the
                    original bytes unchanged.
                  default: false
                height:
                  type: integer
                  description: Target height in pixels
                width:
                  type: integer
                  description: Target width in pixels
      responses:
        "200":
          description: Successful upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized access
        "403":
          description: Bucket-scoped token used for a different bucket
        "413":
          description: File too large
  /batch/upload:
    post:
      summary: Batch file upload
      description: |
        Upload multiple files in a single request.
        - Maximum file count: 10
        - Maximum total size: 100MB
        - Returns individual result for each file
      tags:
        - File
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Files to upload
                bucket:
                  type: string
                  description: >-
                    Target bucket name. Required with the general token. Optional
                    with a bucket-scoped token, which always writes to its own
                    bucket; naming a different bucket returns 403.
                path:
                  type: string
                  description: Target directory path (optional)
                aws_upload:
                  type: boolean
                  deprecated: true
                  description: >-
                    Accepted and ignored. Archiving to cold storage is a property
                    of the deployment (on when AWS credentials are configured),
                    not of the request. Kept so existing clients do not fail
                    validation; it will be removed in a later major version.
                  default: false
                optimize:
                  type: boolean
                  description: >-
                    When true, each uploaded image is stored as a
                    visually-lossless, size-reduced version (longest side capped
                    at OPTIMIZE_MAX_DIMENSION). Animated GIFs and non-images pass
                    through untouched. Default false stores originals unchanged.
                  default: false
      responses:
        "200":
          description: Successful batch upload
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UploadResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized access
        "403":
          description: Bucket-scoped token used for a different bucket
  /{bucket}/{path}:
    get:
      summary: Get original image
      description: |
        Retrieves the original image from specified bucket and path.
        - Caching enabled
        - No automatic format conversion
        - ETag support
      tags:
        - Image
      parameters:
        - name: bucket
          in: path
          required: true
          schema:
            type: string
          description: Bucket name
        - name: path
          in: path
          required: true
          schema:
            type: string
          description: File path
      # Public: serving objects is the point of a CDN. Writes are the authenticated part.
      security: []
      responses:
        "200":
          description: Image file
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: Image not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete file
      description: |
        Deletes a file from the specified bucket.
        - Requires authentication
        - Can optionally delete from AWS S3 as well
      tags:
        - File
      security:
        - BearerAuth: []
      parameters:
        - name: bucket
          in: path
          required: true
          schema:
            type: string
          description: >-
            Bucket name. With a bucket-scoped token this must be the token's own
            bucket; any other value returns 403.
        - name: path
          in: path
          required: false
          schema:
            type: string
          description: File path to delete
        - name: aws_delete
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Whether to delete from AWS S3 as well
      responses:
        "200":
          description: File deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized access
        "403":
          description: Bucket-scoped token used for a different bucket
        "404":
          description: File not found
  /{bucket}/w:{width}/h:{height}/{path}:
    get:
      summary: Get resized image
      description: |
        Retrieves the image with specified width and height.
        - Automatic aspect ratio preservation
        - Format optimization
        - Caching enabled
      tags:
        - Image
      parameters:
        - name: bucket
          in: path
          required: true
          schema:
            type: string
          description: Bucket name
        - name: width
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2000
          description: Desired width (pixels)
        - name: height
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2000
          description: Desired height (pixels)
        - name: path
          in: path
          required: true
          schema:
            type: string
          description: File path
      # Public, like the other read routes.
      security: []
      responses:
        "200":
          description: Resized image
          content:
            image/*:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid size parameters
        "404":
          description: Image not found
  /batch/delete:
    delete:
      summary: Batch delete files
      description: |
        Deletes multiple files in a single request.
        - Requires authentication
        - Can optionally delete from AWS S3
        - Returns individual status for each file
      tags:
        - File
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - files
              properties:
                bucket:
                  type: string
                  description: >-
                    Source bucket name. Required with the general token. Optional
                    with a bucket-scoped token, which always deletes from its own
                    bucket; naming a different bucket returns 403.
                files:
                  type: array
                  items:
                    type: string
                  description: List of file paths to delete
                  minItems: 1
                aws_delete:
                  type: boolean
                  description: Whether to delete from AWS S3 as well
                  default: false
      responses:
        "200":
          description: Batch deletion result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        filename:
                          type: string
                        success:
                          type: boolean
                        error:
                          type: string
                        aws_error:
                          type: string
        "400":
          description: Invalid request
        "401":
          description: Unauthorized access
        "403":
          description: Bucket-scoped token used for a different bucket
        "500":
          description: Internal server error
  /upload-url:
    post:
      summary: Upload file from URL
      description: |
        Downloads and uploads a file from a given URL.
        - Maximum file size: 100MB
        - Supports various file formats
        - Can optionally upload to AWS S3
      tags:
        - File
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
                  description: Source URL to download from
                bucket:
                  type: string
                  description: >-
                    Target bucket name. Required with the general token. Optional
                    with a bucket-scoped token, which always writes to its own
                    bucket; naming a different bucket returns 403.
                path:
                  type: string
                  description: Target path (optional)
                aws_upload:
                  type: boolean
                  deprecated: true
                  description: >-
                    Accepted and ignored. Archiving to cold storage is a property
                    of the deployment (on when AWS credentials are configured),
                    not of the request. Kept so existing clients do not fail
                    validation; it will be removed in a later major version.
                  default: false
                optimize:
                  type: boolean
                  description: >-
                    When true, the downloaded image is stored as a
                    visually-lossless, size-reduced version. Non-images pass
                    through untouched. Only http/https URLs to public hosts are
                    allowed (SSRF guard). Default false stores the original.
                  default: false
      responses:
        "200":
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: Invalid request or URL
        "401":
          description: Unauthorized access
        "403":
          description: Bucket-scoped token used for a different bucket
        "413":
          description: File too large
  /resize:
    post:
      summary: Resize image
      description: |
        Resizes an uploaded image to specified dimensions.
        - Maintains aspect ratio if only width or height is specified
        - Supports common image formats
        - Returns resized image directly
      tags:
        - Image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file to resize
                width:
                  type: integer
                  minimum: 1
                  maximum: 2000
                  description: Target width in pixels
                height:
                  type: integer
                  minimum: 1
                  maximum: 2000
                  description: Target height in pixels
      responses:
        "200":
          description: Resized image
          content:
            image/*:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid request or image format
        "413":
          description: Image too large
  /archive:
    post:
      summary: Archive objects to cold storage
      description: |
        Moves specific objects to cold storage and, by default, frees the local
        copies.

        The URL of an archived object does not change. A read that no longer
        finds the object locally is served from the archive, so links already
        stored in a caller's database keep working untouched.

        An object is only removed locally after the archive has confirmed a copy
        of the same size, so a `failed` result always means the object is still
        served exactly as before. Calling again on an already-archived object is
        a no-op, which makes batches safe to retry.

        Accepts either token kind. A bucket-scoped token can only archive inside
        its own bucket; naming another returns 403.
      tags:
        - Image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - files
              properties:
                bucket:
                  type: string
                  description: >-
                    Target bucket. Optional when authenticating with a
                    bucket-scoped token, which always acts on its own bucket;
                    naming a different bucket returns 403.
                files:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: >-
                    Object keys or full CDN URLs. Both are accepted because
                    callers usually store the URL returned at upload time. A URL
                    pointing at another host or another bucket is rejected.
                  example:
                    - 2024/01/30/image.jpg
                    - https://cdn.example.com/photos/2024/01/30/other.jpg
                evict:
                  type: boolean
                  default: true
                  description: >-
                    Whether to remove the local copy once the archive is verified
                    to hold the object. Set false to take a copy and keep serving
                    locally.
      responses:
        "200":
          description: Per-file outcome and a summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        file:
                          type: string
                          description: The reference as supplied by the caller
                        object:
                          type: string
                          description: The resolved object key
                        status:
                          type: string
                          enum:
                            - archived
                            - archived_kept
                            - already_archived
                            - not_found
                            - failed
                        size:
                          type: integer
                          format: int64
                        error:
                          type: string
                  summary:
                    type: object
                    properties:
                      archived:
                        type: integer
                      archived_kept:
                        type: integer
                      already_archived:
                        type: integer
                      not_found:
                        type: integer
                      failed:
                        type: integer
                      bytes_freed:
                        type: integer
                        format: int64
        "400":
          description: Invalid body, missing bucket, or batch larger than MAX_BATCH_FILES
        "403":
          description: Bucket-scoped token naming a different bucket
        "503":
          description: No archive is configured on this deployment
  /health:
    get:
      summary: Health check
      description: |
        Checks the health status of all services.
        - MinIO connection
        - AWS connection
        - Cache service
      tags:
        - System
      # Public: used by load balancers and probes, no credential required.
      security: []
      responses:
        "200":
          description: Successful health check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheck"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /metrics:
    get:
      summary: Prometheus metrics
      description: |
        Returns system metrics in Prometheus format.
        Metrics include:
        - HTTP requests
        - File operations
        - Cache status
        - System resources
      tags:
        - System
      responses:
        "200":
          description: Metrics in Prometheus format
          content:
            text/plain:
              schema:
                type: string
  /monitor:
    get:
      tags:
        - System
      summary: Get current monitoring statistics
      description: Returns current system statistics and monitoring data
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current monitoring statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                      active_uploads:
                        type: integer
                        description: Number of active uploads
                      upload_speed:
                        type: number
                        format: float
                        description: Current upload speed in bytes/second
                      cache_hit_rate:
                        type: number
                        format: float
                        description: Cache hit rate percentage
                      cpu_usage:
                        type: number
                        format: float
                        description: CPU usage percentage
                      memory_usage:
                        type: number
                        format: float
                        description: Memory usage percentage
                      disk_usage:
                        type: object
                        additionalProperties:
                          type: integer
                        description: Disk usage by mount point
                      errors:
                        type: array
                        items:
                          type: string
                        description: Recent error messages
  /ws:
    get:
      summary: WebSocket connection
      description: |
        WebSocket connection for real-time system monitoring.
        Requires the auth token as a `token` query parameter (WebSocket clients
        cannot set an Authorization header): `ws://host/ws?token=<TOKEN>`.
        You can monitor the following events:
        - File uploads
        - System metrics
        - Error states
      tags:
        - WebSocket
      # Not public: the token goes in the query string, since a browser
      # cannot set an Authorization header on a WebSocket handshake.
      security:
        - TokenQuery: []
      parameters:
        - name: token
          in: query
          required: true
          description: Auth token (same value as the Bearer TOKEN)
          schema:
            type: string
      responses:
        "101":
          description: WebSocket connection successful
        "401":
          description: Missing or invalid token
        "426":
          description: Upgrade required (not a WebSocket request)
  /minio/bucket-list:
    get:
      summary: List MinIO buckets
      tags:
        - Minio
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of MinIO buckets
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    creationDate:
                      type: string
                      format: date-time
  /minio/{bucket}/exists:
    get:
      summary: Check if MinIO bucket exists
      tags:
        - Minio
      security:
        - BearerAuth: []
      parameters:
        - name: bucket
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bucket existence check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
  /minio/{bucket}/create:
    get:
      summary: Create MinIO bucket
      tags:
        - Minio
      security:
        - BearerAuth: []
      parameters:
        - name: bucket
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bucket creation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /minio/{bucket}/delete:
    delete:
      summary: Delete MinIO bucket
      tags:
        - Minio
      security:
        - BearerAuth: []
      parameters:
        - name: bucket
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bucket deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /aws/bucket-list:
    get:
      summary: List AWS buckets
      description: |
        Lists all buckets in AWS account.
        Requires authentication.
      tags:
        - AWS
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Bucket list
          content:
            application/json:
              schema:
                type: object
                properties:
                  buckets:
                    type: array
                    items:
                      type: string
  /aws/{bucket}/exists:
    get:
      summary: Check if AWS bucket exists
      tags:
        - AWS
      security:
        - BearerAuth: []
      parameters:
        - name: bucket
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bucket existence check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
  /aws/vault-list:
    get:
      summary: List AWS Glacier vaults
      tags:
        - AWS
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of Glacier vaults
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    vaultName:
                      type: string
                    creationDate:
                      type: string
                      format: date-time
  /aws/glacier/{vault}/initiate-retrieval/{archiveId}:
    post:
      summary: Initiate Glacier archive retrieval
      description: |
        Starts a job to retrieve an archive from AWS Glacier.
        The retrieval process takes 3-5 hours for Standard tier.
      tags:
        - AWS Glacier
      security:
        - BearerAuth: []
      parameters:
        - name: vault
          in: path
          required: true
          schema:
            type: string
          description: Glacier vault name
        - name: archiveId
          in: path
          required: true
          schema:
            type: string
          description: Archive ID to retrieve
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [Standard, Bulk, Expedited]
            default: Standard
          description: Retrieval tier (affects cost and speed)
      responses:
        "200":
          description: Retrieval job initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      jobId:
                        type: string
                      location:
                        type: string
                      type:
                        type: string
                      message:
                        type: string
                      estimatedTime:
                        type: string
        "400":
          description: Invalid request
        "401":
          description: Unauthorized access
        "500":
          description: Internal server error
  /aws/glacier/{vault}/jobs:
