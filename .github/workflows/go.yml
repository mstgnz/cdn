# Build and test the service.
#
# The build runs inside the project image rather than directly on the runner.
# gopkg.in/gographics/imagick.v3 is a cgo binding to ImageMagick 7, which the
# runner does not have and cannot get from apt (Ubuntu ships ImageMagick 6).
# The dockerfile already builds ImageMagick 7 from source, so reusing it keeps
# a single definition of the toolchain and additionally verifies that the image
# which actually gets deployed still builds.
#
# Compiling ImageMagick takes most of the job's time, so the layers are cached in
# the GitHub Actions cache. That layer only changes when the pinned
# IMAGEMAGICK_VERSION in the dockerfile changes, which is why the version is
# pinned rather than resolved at build time.
name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Tests run in the build stage, not the final image: the runtime stage
      # deliberately has no Go toolchain. This step also covers `go build ./...`,
      # since the stage compiles the binary in its last layer.
      #
      # load: true puts the image into the local daemon so the next step can run
      # it. Without it buildx keeps the result in its own cache only.
      - name: Build toolchain stage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: build
          load: true
          tags: cdn:build
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test
        run: docker run --rm --entrypoint go cdn:build test ./...

      # Building the runtime stage on top reuses everything above from cache and
      # verifies that the image which actually ships still assembles.
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cdn:ci
          cache-from: type=gha

      # Losing docker/policy.xml or MAGICK_CONFIGURE_PATH in the runtime stage
      # would disable the ImageMagick hardening silently, so assert it is live in
      # the image that ships rather than trusting the dockerfile to be right.
      - name: Verify the ImageMagick policy is active in the runtime image
        run: |
          policy=$(docker run --rm --entrypoint magick cdn:ci -list policy)
          echo "$policy"
          for pattern in \
            "Path: /etc/ImageMagick/policy.xml" \
            "pattern: PDF" \
            "pattern: MSL" \
            "Policy: Delegate"; do
            echo "$policy" | grep -q -- "$pattern" || {
              echo "::error::ImageMagick policy is not active, missing: $pattern"
              exit 1
            }
          done

      # The Go tests run in the build stage, so a codec package missing from the
      # runtime stage would not fail them: decoding would break only in
      # production. Exercise the formats the service actually handles, in the
      # image that ships, and confirm a blocked coder stays blocked.
      - name: Verify image decoding in the runtime image
        run: |
          docker run --rm --entrypoint sh cdn:ci -c '
            set -e
            for fmt in png jpeg webp gif tiff; do
              magick -size 64x64 gradient:red-blue "/tmp/t.$fmt"
              magick "/tmp/t.$fmt" -resize 32x32 "info:-"
            done
            if magick -size 10x10 xc:white /tmp/x.pdf 2>/dev/null; then
              echo "PDF coder is not blocked; the security policy is not being applied"
              exit 1
            fi
          '
