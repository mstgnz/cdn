# Load balancer in front of the API replicas.
#
# This file is mounted at /etc/nginx/conf.d/default.conf, so it is included from
# the http context and may declare http-level directives (map, proxy_cache_path).

# Only a real WebSocket handshake should ask the upstream to upgrade. Sending
# `Connection: upgrade` on every request, as this config used to, tells the
# upstream that each ordinary GET is a protocol switch and prevents the
# connection from being returned to the keepalive pool below, so the pool was
# never actually used and every request paid for a fresh TCP connection.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# No response cache here, deliberately.
#
# This file used to carry proxy_cache_valid and proxy_cache_use_stale without a
# proxy_cache zone, which silently disabled both: every request reached the Go
# service and X-Cache-Status was always empty. The obvious repair is to add the
# zone, and that is wrong. Caching at this layer means a deleted object keeps
# being served until the entry expires, and nginx has no purge in the open source
# build, so DELETE would have no way to take effect. A storage service that
# answers 200 for something you just deleted is a worse thing to ship than a
# missing optimisation.
#
# Caching belongs in the CDN or reverse proxy in front of this, where the
# operator already controls invalidation. The dead directives are removed rather
# than activated so nobody has to wonder which of the two states this is in.

upstream cdn_api {
    server api:9090 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;

    # Large headers
    large_client_header_buffers 4 64k;
    client_header_buffer_size 16k;

    # Max body size to prevent 413 errors
    client_max_body_size 100M;

    # Pre-flight requests
    location ~ /\.(?:preflight) {
        return 204;
    }

    # Handle OPTIONS method
    location / {

        # Proxy configuration
        proxy_pass http://cdn_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeout settings
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Images take the same path as everything else. The only thing that used to
    # distinguish them here was the inert cache configuration described above.
    #
    # If you do add caching in the proxy in front of this, do not set
    # `proxy_ignore_headers Cache-Control`: when every decode slot is busy the
    # service answers a resize request with the original bytes and marks that
    # response no-store, and ignoring it would pin a full-size image under a
    # ?width= URL for the whole cache lifetime.
}
