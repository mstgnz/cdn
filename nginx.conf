# Load balancer in front of the API replicas.
#
# This file is mounted at /etc/nginx/conf.d/default.conf, so it is included from
# the http context and may declare http-level directives (map, proxy_cache_path).

# Only a real WebSocket handshake should ask the upstream to upgrade. Sending
# `Connection: upgrade` on every request, as this config used to, tells the
# upstream that each ordinary GET is a protocol switch and prevents the
# connection from being returned to the keepalive pool below, so the pool was
# never actually used and every request paid for a fresh TCP connection.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Response cache for the image routes. The directives below used to be present
# without this zone, which silently disabled all of them: proxy_cache_valid and
# proxy_cache_use_stale do nothing unless proxy_cache names a zone, so every
# request reached the Go service and X-Cache-Status was always empty.
#
# A deployment that already has a CDN or another caching proxy in front can
# delete this and the proxy_cache line that uses it.
proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn_cache:10m
                 max_size=1g inactive=7d use_temp_path=off;

upstream cdn_api {
    server api:9090 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;

    # Large headers
    large_client_header_buffers 4 64k;
    client_header_buffer_size 16k;

    # Max body size to prevent 413 errors
    client_max_body_size 100M;

    # Pre-flight requests
    location ~ /\.(?:preflight) {
        return 204;
    }

    # Handle OPTIONS method
    location / {

        # Proxy configuration
        proxy_pass http://cdn_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeout settings
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Cache for images
    location ~* \.(jpg|jpeg|png|gif|ico|webp|bmp|svg|avif)$ {
        proxy_pass http://cdn_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;

        proxy_cache cdn_cache;
        # The query string carries the resize parameters, so it has to be part of
        # the key: without it every ?width= variant would collide on one entry.
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 30m;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;
        expires 30d;

        # Cache-Control from the upstream is deliberately honoured here. When
        # every decode slot is busy the service answers a resize request with the
        # original bytes and marks that response no-store; caching it would pin a
        # full-size image under a ?width= URL for the whole cache lifetime.
        # Adding `proxy_ignore_headers Cache-Control` would reintroduce exactly
        # that bug.
    }
}
